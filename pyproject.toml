[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-remote-agent-mcp"
version = "0.1.0"
description = "A workspace-scoped remote development MCP server for Gemini custom apps"
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "gemini", "remote-agent", "oauth2", "fastmcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26.0,<2.0.0",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
remote-agent-mcp = "remote_agent_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_agent_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101", "S108", "S404", "S603", "S607"]
